<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="av-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="av-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="160" cy="160" r="160" fill="url(#av-bg)"/>
  
  <!-- Subtle decorative rings -->
  <circle cx="160" cy="160" r="148" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.2"/>
  <circle cx="160" cy="160" r="136" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="8 6" opacity="0.3"/>

  <!-- Body / Shoulders -->
  <path d="M 60 320 C 60 250, 110 230, 160 230 C 210 230, 260 250, 260 320 Z" fill="#1e1b4b"/>
  <!-- T-shirt collar -->
  <path d="M 130 230 C 130 255, 190 255, 190 230 Z" fill="#312e81"/>

  <!-- Head / Neck -->
  <rect x="142" y="180" width="36" height="40" rx="6" fill="#f59e0b" opacity="0.9"/>
  <ellipse cx="160" cy="140" rx="55" ry="65" fill="#fde047"/>

  <!-- Modern Hair style -->
  <path d="M 105 130 C 105 70, 140 50, 180 50 C 215 50, 220 80, 220 110 C 210 100, 190 95, 175 100 C 150 105, 130 115, 105 130 Z" fill="#1e1b4b"/>

  <!-- Stylish Glasses -->
  <rect x="118" y="125" width="34" height="26" rx="6" fill="none" stroke="#0f172a" stroke-width="4"/>
  <rect x="168" y="125" width="34" height="26" rx="6" fill="none" stroke="#0f172a" stroke-width="4"/>
  <line x1="152" y1="138" x2="168" y2="138" stroke="#0f172a" stroke-width="4"/>

  <!-- Eyes -->
  <circle cx="135" cy="138" r="4" fill="#0f172a"/>
  <circle cx="185" cy="138" r="4" fill="#0f172a"/>
  <circle cx="137" cy="136" r="1.5" fill="#ffffff"/>
  <circle cx="187" cy="136" r="1.5" fill="#ffffff"/>

  <!-- Friendly Smile -->
  <path d="M 144 175 Q 160 190 176 175" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>

  <!-- Badge: Code & Design icon pill -->
  <g transform="translate(195, 220)">
    <rect width="90" height="34" rx="17" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.2))"/>
    <text x="45" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#4f46e5" text-anchor="middle">&lt;UI/UX/&gt;</text>
  </g>
</svg>