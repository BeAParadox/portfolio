<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="p4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="p4-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" rx="16" fill="url(#p4-bg)"/>
  
  <rect x="24" y="24" width="752" height="472" rx="12" fill="#09090b" stroke="#3f3f46" stroke-width="1.5"/>
  <rect x="24" y="24" width="752" height="44" rx="12" fill="#18181b"/>
  <circle cx="48" cy="46" r="6" fill="#52525b"/>
  <circle cx="68" cy="46" r="6" fill="#52525b"/>
  <circle cx="88" cy="46" r="6" fill="#52525b"/>
  <text x="120" y="50" font-family="system-ui, monospace" font-size="11" fill="#a1a1aa">kinetix.design/portfolio</text>

  <!-- Big Typography Visual -->
  <text x="60" y="140" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">WE CRAFT</text>
  <text x="60" y="195" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="url(#p4-neon)" letter-spacing="-1">DIGITAL RADICALS.</text>
  
  <text x="60" y="235" font-family="system-ui, sans-serif" font-size="14" fill="#a1a1aa">Award-winning interaction design &amp; 3D creative engineering.</text>

