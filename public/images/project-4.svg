  <g transform="translate(480, 100)">
    <polygon points="120,20 220,70 120,130 20,80" fill="#3b82f6" opacity="0.8"/>
    <polygon points="20,80 120,130 120,230 20,180" fill="#1d4ed8" opacity="0.9"/>
    <polygon points="120,130 220,70 220,170 120,230" fill="#60a5fa" opacity="0.85"/>
  </g>

  <!-- Grid cards below -->
  <rect x="60" y="280" width="200" height="180" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="80" y="315" font-family="system-ui, sans-serif" font-size="12" fill="#ec4899">CASE 01</text>
  <text x="80" y="340" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Hyperion VR</text>
  <text x="80" y="365" font-family="system-ui, sans-serif" font-size="11" fill="#71717a">Spatial UI &amp; WebGL</text>

  <rect x="280" y="280" width="200" height="180" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
