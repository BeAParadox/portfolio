  <text x="300" y="340" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Nova Engine</text>
  <text x="300" y="365" font-family="system-ui, sans-serif" font-size="11" fill="#71717a">Brand identity &amp; 3D</text>

  <rect x="500" y="280" width="240" height="180" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="520" y="315" font-family="system-ui, sans-serif" font-size="12" fill="#3b82f6">CASE 03</text>
  <text x="520" y="340" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Flux Pay Protocol</text>
